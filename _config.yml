# _config.yml

title: My Blog
description: A simple blog powered by Jekyll and the Minima theme.
author:
  name: Your Name
  email: your@email.com

# Use the official Jekyll theme
theme: minima

# Enable syntax highlighting, if you plan to include code
highlighter: rouge

# Set timezone if you want accurate post dates
timezone: Asia/Jakarta  # Change to your preferred timezone

# Customize navigation (optional - needs minima >=2.5.0)
minima:
  skin: auto  # Light/Dark theme auto-switch
  social_links:
    github: yourusername
    twitter: yourhandle
    # Add more: linkedin, mastodon, dribbble, etc.
