<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <style>
  body[data-theme='dark'] {
    background-color: #111;
    color: #eee;
  }
  body[data-theme='dark'] a { color: #80d0ff; }
  .theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: transparent;
    border: 1px solid gray;
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
</style>
  </head>
  <body>

    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <hr />
    <footer style="text-align: center; font-size: 0.9em; color: gray; padding: 1em 0;">
      <span>&copy; <span id="year"></span> Crafted by <a href="https://github.com/fahmiyufrizal" target="_blank" style="color: inherit; text-decoration: none;">fahmiyufrizal</a></span>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>

    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>

<script>
  function setTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }

  function toggleTheme() {
    const current = localStorage.getItem('theme') || 'light';
    setTheme(current === 'light' ? 'dark' : 'light');
  }

  // Init on load
  const savedTheme = localStorage.getItem('theme') || 'light';
  setTheme(savedTheme);
</script>
  </body>
</html>
