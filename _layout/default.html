<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  </head>
  <body>

    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <hr />
    <footer style="text-align: center; font-size: 0.9em; color: gray; padding: 1em 0;">
      <span>&copy; <span id="year"></span> Crafted by <a href="https://github.com/fahmiyufrizal" target="_blank" style="color: inherit; text-decoration: none;">fahmiyufrizal</a></span>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>

  </body>
</html>
